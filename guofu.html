<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>首席大臣 1776</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 布局：顶上两条账目（金银、货物）始终可见；下面一次只有一件事，三个选项；选完后三个结果一起摊开，再给出斯密的看法。 */
:root {
  --bg: #edf1ec;
  --fg: #17261f;
  --muted: #53645b;
  --panel: #ffffff;
  --line: #cfd8d1;
  --gold: #a87400;
  --goods: #17755a;
  --bad: #b3372b;
  --track: #dbe3dc;
  --pick: #17261f;
  --on-pick: #edf1ec;
  --quote: #f4f7f3;
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-num: "Space Grotesk", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101814; --fg: #e6eee8; --muted: #9db0a5; --panel: #18231d; --line: #2f3f36;
    --gold: #e3b341; --goods: #4fc79f; --bad: #ff8a7a; --track: #24332b;
    --pick: #e6eee8; --on-pick: #101814; --quote: #1d2a23;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101814; --fg: #e6eee8; --muted: #9db0a5; --panel: #18231d; --line: #2f3f36;
  --gold: #e3b341; --goods: #4fc79f; --bad: #ff8a7a; --track: #24332b;
  --pick: #e6eee8; --on-pick: #101814; --quote: #1d2a23;
  color-scheme: dark;
}

body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.75;
  padding-block: 20px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 900; font-size: 1.15rem; margin: 0; }
.prog { font-family: var(--font-num); color: var(--muted); font-size: .9rem; margin: 0; }

.ledger { display: flex; flex-direction: column; gap: 8px; }
.meter { display: grid; grid-template-columns: 9.5em 1fr 3em; gap: 10px; align-items: center; font-size: .9rem; }
.meter .bar { height: 10px; border-radius: 5px; background: var(--track); overflow: hidden; }
.meter .bar i { display: block; height: 100%; border-radius: 5px; transition: width .8s ease; }
.meter.gold i { background: var(--gold); } .meter.goods i { background: var(--goods); }
.meter b { font-family: var(--font-num); font-variant-numeric: tabular-nums; text-align: right; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.5rem, 6vw, 1.9rem); line-height: 1.3; margin: 0; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; margin: 0; }
p { margin: 0; max-width: 36em; }
.eyebrow { color: var(--goods); font-weight: 700; font-size: .9rem; letter-spacing: .08em; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  font: inherit; text-align: left; color: var(--fg); background: transparent;
  border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px;
  display: flex; flex-direction: column; gap: 6px;
}
button.opt { cursor: pointer; font-weight: 700; }
button.opt:hover { border-color: var(--fg); }
button:focus-visible { outline: 3px solid var(--goods); outline-offset: 2px; }
.opt .what { font-weight: 700; }
.opt.mine { border-color: var(--pick); border-width: 2.5px; }
.opt .then { color: var(--muted); font-size: .95rem; }
.opt.mine .then { color: var(--fg); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; font-size: .8rem; }
.tag { border-radius: 999px; padding: 0 9px; background: var(--track); font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.tag.you { background: var(--pick); color: var(--on-pick); font-family: var(--font-body); }
.tag.smith { background: transparent; border: 1px solid var(--goods); color: var(--goods); font-family: var(--font-body); }
.tag.up { color: var(--goods); } .tag.down { color: var(--bad); }

.smithbox { background: var(--quote); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
.smithbox .q { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1.7; }
.smithbox .src { color: var(--muted); font-size: .85rem; }
.go { align-self: flex-end; font: inherit; font-weight: 700; cursor: pointer; border: 0; border-radius: 12px; padding: 10px 22px; background: var(--pick); color: var(--on-pick); }

.score { font-family: var(--font-num); font-weight: 700; font-size: clamp(2.6rem, 12vw, 3.6rem); line-height: 1; color: var(--goods); font-variant-numeric: tabular-nums; }
.recap { display: flex; flex-direction: column; }
.recap div { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.recap .ok { color: var(--goods); font-weight: 700; } .recap .no { color: var(--bad); font-weight: 700; }
.note { color: var(--muted); font-size: .9rem; }
@media (prefers-reduced-motion: reduce) { .meter .bar i { transition: none; } }
</style>
</head>
<body>

<main>
  <div class="top"><p class="brand">首席大臣 1776</p><p class="prog" id="prog"></p></div>
  <div class="ledger" id="ledger"></div>
  <section class="card" id="card"></section>
</main>

<script>

    best: 1,
    q: '“国防比富裕重要得多。”',
    say: '这是斯密自己给自由贸易划出的例外。他承认英国的《航海条例》让贸易吃了亏，却说它也许是英国最明智的商业法规。注意这一步货物是减少的：他并不认为财富是唯一的目标。',
    src: '卷四 第二章'
  },
  {
    key: '政府的本分', title: '国库的钱怎么花',
    text: '国库里还有一笔钱，三位大臣各有主张。无论选哪个，这笔钱都会花掉。',
    opts: [
      ['建一座配得上国王的宫殿', '宫殿很壮观。钱花在了仆役、乐师和庆典上，花完就没有了，没有留下任何能继续生产的东西。', -30, 0],
      ['修桥铺路，设法庭保护契约，办平民学校', '货物运得更远，生意人敢和陌生人签约，整天重复一道工序的工人也能读书识字。这些事没有哪个商人愿意独自出钱，却对所有人有利。', -30, 25],
      ['补贴你最看好的丝绸业', '丝绸商拿到了补贴，把工人和资本从别的行业吸了过来。可这里做丝绸本来就不划算，全国人在为它倒贴。', -30, -5]
    ],
    best: 1,
    q: '斯密给君主留了三件事：抵御外敌，建立公正的司法，兴办那些对社会极有益、却没有哪个人能从中获利的公共工程和机构。',
    say: '他并不主张政府什么都不管，道路、桥梁和平民教育都在这张清单里。清单之外的事，他不相信有哪位大臣比当事人自己更清楚钱该往哪里投。',
    src: '卷四 第九章；卷五 第一章'
  },
  {
    key: '赋税四原则', title: '该收税了',
    text: '路修了，法庭和学校也办了，国库见了底。这些开支每年都要有，你得定一套收税的办法。',
    opts: [
      ['把收税权包给出价最高的商人，他怎么收你不过问', '国库马上拿到一大笔钱。包税人为了回本，向百姓收了三倍，还养着一支自己的税吏队伍。', 10, -12],
      ['按各人收入的比例收，数额和日期事先写明，在纳税人手头方便的时候收', '没有人喜欢交税，但人人知道该交多少、什么时候交，税吏无从勒索，征收的花费也最小。', 15, -2],
      ['对盐和面包这些人人离不开的东西征重税', '税很好收。最穷的人负担最重，工钱被迫上涨，所有货物跟着变贵。', 15, -10]
    ],
    best: 1,
    q: '赋税四原则：按各人的能力分担；数额和时间确定，不能任意；在纳税人最方便的时候、用最方便的方式收；征收的费用尽量小。',
    say: '斯密不反对收税，政府要做上一件事里那三项本分，就得有收入。他反对的是任意、扰民、收十文只有六文进国库的收法。',
    src: '卷五 第二章'
  }
];

const BOOKS = [[0, '卷一', '劳动生产力为什么会提高'], [5, '卷二', '资本'], [7, '卷三', '各国走向富裕的不同道路'], [8, '卷四', '重商主义'], [11, '卷五', '国家的收入和开支']];
const bookOf = i => BOOKS.filter(b => b[0] <= i).pop();
const BEST = LEVELS.reduce((t, L) => ({ gold: t.gold + L.opts[L.best][2], goods: t.goods + L.opts[L.best][3] }), { gold: 100, goods: 100 });

const $ = id => document.getElementById(id);
let picks = [];
let stage = 'ask'; // ask | shown | end

const totals = upto => picks.slice(0, upto).reduce((t, p, i) => {
  const o = LEVELS[i].opts[p];
  return { gold: t.gold + o[2], goods: Math.max(5, t.goods + o[3]) };
}, { gold: 100, goods: 100 });

const delta = (v, label) => v === 0 ? '' : `<span class="tag ${v > 0 ? 'up' : 'down'}">${label} ${v > 0 ? '+' : '−'}${Math.abs(v)}</span>`;

function ledger() {
  const answered = stage === 'ask' ? picks.length : picks.length;
  const t = totals(answered);
  const w = v => Math.max(2, Math.min(100, v / (BEST.goods + 10) * 100)).toFixed(1);
  $('ledger').innerHTML = `
    <div class="meter gold"><span>国库金银</span><div class="bar"><i style="width:${w(t.gold)}%"></i></div><b>${t.gold}</b></div>
    <div class="meter goods"><span>百姓能消费的货物</span><div class="bar"><i style="width:${w(t.goods)}%"></i></div><b>${t.goods}</b></div>`;
}

function render() {
  const i = stage === 'ask' ? picks.length : picks.length - 1;
  if (!$('ledger').children.length) ledger();
  if (stage === 'end') return renderEnd();
  const L = LEVELS[i];
  $('prog').textContent = `第 ${i + 1} 件事 / 共 ${LEVELS.length} 件`;
  const bk = bookOf(i);
  let h = `<p class="eyebrow">${bk[1]}　${bk[2]}</p><h1>${L.title}</h1><p>${L.text}</p><div class="opts">`;
  if (stage === 'ask') {
    h += L.opts.map((o, k) => `<button class="opt" type="button" data-k="${k}">${o[0]}</button>`).join('');
    h += '</div>';
  } else {
    const mine = picks[i];
    h += L.opts.map((o, k) => `<div class="opt${k === mine ? ' mine' : ''}">
      <span class="what">${o[0]}</span>
      <span class="tags">${k === mine ? '<span class="tag you">你的选择</span>' : ''}${k === L.best ? '<span class="tag smith">斯密的选择</span>' : ''}${delta(o[2], '金银')}${delta(o[3], '货物')}</span>
      <span class="then">${o[1]}</span></div>`).join('');
    h += `</div><div class="smithbox"><h2>斯密怎么看：${L.key}</h2><p class="q">${L.q}</p><p>${L.say}</p><p class="src">《国富论》${L.src}，引文为大意</p></div>
      <button class="go" id="go" type="button">${i + 1 < LEVELS.length ? '下一件事' : '看结算'}</button>`;
  }
  $('card').innerHTML = h;
  // 让进度条从旧值滑到新值
  requestAnimationFrame(ledger);
}

function renderEnd() {
  const t = totals(LEVELS.length), right = picks.filter((p, i) => p === LEVELS[i].best).length;
  const verdict = t.goods >= BEST.goods - 30 ? '你和斯密想到一块去了。'
    : t.goods >= 160 ? '一半是斯密，一半是重商主义。'
    : '你是一位标准的重商主义大臣：盯着国库，百姓却变穷了。';
  $('prog').textContent = '结算';
  $('card').innerHTML = `<h1>${verdict}</h1>
    <div><div class="score">${t.goods}</div><p class="note">百姓能消费的货物（开局是 100，最高 ${BEST.goods}）。国库金银最后是 ${t.gold}。</p></div>
    <p>这个游戏只按一个数字算分：百姓能消费的货物。国库里的金银一分不算。</p>
    <p>这正是《国富论》开篇给财富下的定义：一个国家的财富，是它每年的劳动生产出来、供人民消费的全部必需品和便利品，不是国王金库里的金银。照斯密的办法走完全程，国库只剩 ${BEST.gold}，货物却接近开局的三倍。</p>
    <div class="recap">${LEVELS.map((L, i) => `<div><span>${bookOf(i)[1]}　${L.key}</span><span class="${picks[i] === L.best ? 'ok' : 'no'}">${picks[i] === L.best ? '与斯密一致' : '与斯密不同'}</span></div>`).join('')}</div>
    <p class="note">${LEVELS.length} 件事里你有 ${right} 件和斯密选得一样。五卷书各挑了几件事，分数是为游戏编的。书里还谈了货币的起源、地租、公债，也谈了分工的代价：一辈子只做一道工序的人会变得迟钝，所以他主张办平民教育。</p>
    <button class="go" id="again" type="button">再当一次大臣</button>`;
  ledger();
}

$('card').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  if (b.dataset.k !== undefined && stage === 'ask') { picks.push(+b.dataset.k); stage = 'shown'; }
  else if (b.id === 'go') stage = picks.length < LEVELS.length ? 'ask' : 'end';
  else if (b.id === 'again') { picks = []; stage = 'ask'; }
  else return;
  render();
  if (b.id) window.scrollTo({ top: 0 });
};

function start(d) {
  if (Array.isArray(d.picks) && d.picks.length <= LEVELS.length && d.picks.every((p, i) => LEVELS[i].opts[p])) {
    picks = d.picks;
    stage = ['ask', 'shown', 'end'].includes(d.stage) ? d.stage : 'ask';
    if (stage === 'shown' && !picks.length) stage = 'ask';
    if (stage === 'end' && picks.length < LEVELS.length) stage = 'ask';
    if (stage === 'ask' && picks.length === LEVELS.length) stage = 'end';
  }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ picks, stage }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
</body>
</html>
