<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>再问一层</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* 布局：水面是一张潜点清单；选一个潜点后一层层下潜，每层先猜再揭晓，卡片颜色随深度变暗；潜到底是没人知道答案的地方。 */
:root {
  --bg: #f1f5f8; --fg: #0e2233; --muted: #4d6274; --panel: #ffffff; --line: #d3dde6; --chip: #dde6ee;
  --l1: #d8e8f4; --l1-fg: #0e2233;
  --l2: #a6cae6; --l2-fg: #0b1f30;
  --l3: #23608f; --l3-fg: #ffffff;
  --l4: #0f304e; --l4-fg: #eef5fb;
  --edge: #07182a; --edge-fg: #ffc46b;
  --star: #b07400; --ok: #12754f; --bad: #b3372b; --ok-on-dark: #7fe0b5; --bad-on-dark: #ffa497;
  --font-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --font-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-num: "Space Grotesk", "Noto Sans SC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1219; --fg: #e8f0f6; --muted: #9db0c0; --panel: #141f2a; --line: #2a3a49; --chip: #1a2a38;
    --l1: #2c4c66; --l1-fg: #f2f7fb; --l2: #213d55; --l2-fg: #eef5fb; --l3: #172e42; --l3-fg: #e8f0f6; --l4: #0f2233; --l4-fg: #e8f0f6;
    --edge: #050c13; --edge-fg: #ffc46b;
    --star: #ffc46b; --ok: #7fe0b5; --bad: #ffa497; --ok-on-dark: #7fe0b5; --bad-on-dark: #ffa497;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1219; --fg: #e8f0f6; --muted: #9db0c0; --panel: #141f2a; --line: #2a3a49; --chip: #1a2a38;
  --l1: #2c4c66; --l1-fg: #f2f7fb; --l2: #213d55; --l2-fg: #eef5fb; --l3: #172e42; --l3-fg: #e8f0f6; --l4: #0f2233; --l4-fg: #e8f0f6;
  --edge: #050c13; --edge-fg: #ffc46b;
  --star: #ffc46b; --ok: #7fe0b5; --bad: #ffa497; --ok-on-dark: #7fe0b5; --bad-on-dark: #ffa497;
  color-scheme: dark;
}
body {
  margin: 0;
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.75;
  padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
main { max-width: 580px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--edge-fg); outline-offset: 2px; }
.num { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 900; font-size: 1.25rem; }
.mini { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 0 10px; font-size: .8rem; color: var(--muted); }
.muted { color: var(--muted); font-size: .9rem; }

.rank { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.rank .row { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: baseline; }
.rank h1 { font-family: var(--font-display); font-weight: 900; font-size: 1.5rem; margin: 0; line-height: 1.3; }
.bar { height: 10px; border-radius: 5px; background: var(--chip); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--l3); border-radius: 5px; }

.sites { display: flex; flex-direction: column; gap: 8px; }
.site { text-align: left; border: 1.5px solid var(--line); background: var(--panel); border-radius: 14px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 0 12px; align-items: center; }
.site:hover:not(:disabled) { border-color: var(--fg); }
.site b { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; line-height: 1.4; }
.site .stars { font-size: 1.1rem; color: var(--star); letter-spacing: 2px; white-space: nowrap; }
.site small { grid-column: 1 / -1; color: var(--muted); font-size: .85rem; }
.site:disabled { opacity: .55; cursor: default; border-style: dashed; }
.rush { border: 0; border-radius: 14px; padding: 14px; background: var(--edge); color: var(--edge-fg); font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; }
.rush small { display: block; font-family: var(--font-body); font-weight: 400; font-size: .85rem; opacity: .85; }
.rush:disabled { opacity: .5; cursor: default; }
h2 { font-family: var(--font-display); font-weight: 700; font-size: 1.1rem; margin: 8px 0 0; }
.cards { display: flex; flex-direction: column; gap: 6px; }
.mystery { border-radius: 12px; padding: 10px 14px; background: var(--edge); color: var(--edge-fg); font-size: .95rem; }
.mystery.locked { background: transparent; border: 1px dashed var(--line); color: var(--muted); }

.hud { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; font-size: .9rem; }
.oxy { display: flex; gap: 6px; align-items: center; }
.oxy i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--l3); background: var(--l2); }
.oxy i.gone { background: transparent; border-style: dashed; border-color: var(--line); }
.gauge { display: flex; gap: 4px; }
.gauge i { flex: 1; height: 8px; border-radius: 4px; background: var(--chip); }
.gauge i.d1 { background: var(--l1); } .gauge i.d2 { background: var(--l2); } .gauge i.d3 { background: var(--l3); } .gauge i.d4 { background: var(--l4); }
.gauge i.todo { background: var(--chip); }

.layer { border-radius: 18px; padding: 22px 18px; background: var(--b); color: var(--f); display: flex; flex-direction: column; gap: 14px; animation: sink .4s ease; }
.layer.d1 { --b: var(--l1); --f: var(--l1-fg); --good: var(--ok); --wrong: var(--bad); }
.layer.d2 { --b: var(--l2); --f: var(--l2-fg); --good: var(--f); --wrong: var(--f); }
.layer.d3 { --b: var(--l3); --f: var(--l3-fg); --good: var(--ok-on-dark); --wrong: var(--bad-on-dark); }
.layer.d4 { --b: var(--l4); --f: var(--l4-fg); --good: var(--ok-on-dark); --wrong: var(--bad-on-dark); }
.layer.end { --b: var(--edge); --f: var(--edge-fg); }
@keyframes sink { from { opacity: .3; transform: translateY(-12px); } }
.tag { font-family: var(--font-num); font-size: .8rem; letter-spacing: .12em; opacity: .85; }
.layer h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(1.3rem, 5.5vw, 1.6rem); line-height: 1.4; margin: 0; text-wrap: balance; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1.5px solid currentColor; background: transparent; border-radius: 12px; padding: 10px 14px; font-weight: 700; line-height: 1.5; }
.opt:disabled { cursor: default; opacity: .55; }
.opt.right { opacity: 1; border-width: 3px; }
.opt.right::after { content: "　✓ 正确答案"; font-weight: 400; font-size: .85em; }
.opt.mine.wrong { opacity: 1; text-decoration: line-through; }
.verdict { font-weight: 700; font-size: 1.05rem; color: var(--good); }
.verdict.no { color: var(--wrong); }
.go { align-self: flex-end; border: 0; border-radius: 12px; padding: 10px 22px; background: var(--f); color: var(--b); font-weight: 700; }
.big { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.6; text-wrap: balance; }
.bigstars { font-size: 2rem; letter-spacing: 6px; }
.rowbtn { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
.ghost { border: 1.5px solid currentColor; background: transparent; border-radius: 12px; padding: 9px 18px; }
@media (prefers-reduced-motion: reduce) { .layer { animation: none; } }
</style>
</head>
<body>

<main id="app"></main>

<script>
// 每一层：[问题, [三个选项], 正确项, 揭晓]
const SITES = [
  { name: '天空为什么是蓝的？', layers: [
    ['天空为什么是蓝的？', ['因为它映出了大海的颜色', '空气分子把蓝光散射得最厉害', '空气本身是一种淡蓝色的气体'], 1,
      '阳光是所有颜色混在一起的。它撞上空气分子会被弹向四面八方，波长越短弹得越厉害：强度和波长的四次方成反比，蓝光被散射的强度大约是红光的 6 倍。蓝光洒满了天空，红光大多笔直穿了过去。'],
    ['紫光的波长比蓝光更短。天空为什么不是紫色？', ['紫光全被臭氧层挡住了', '太阳发出的紫光本来就少，眼睛对紫光也很迟钝', '紫光散射太强，全被弹回了太空'], 1,
      '三件事叠在一起：太阳发出的紫光比蓝光少，高层大气又吸收掉一部分，而你眼睛里的三种视锥细胞对紫光很不敏感。天空射来的是一大堆波长的混合，是大脑把它概括成了一个字：蓝。'],
    ['那么，“蓝”到底在哪里？', ['在光里：每种波长自带一种颜色', '在空气里：是空气把光染蓝了', '在脑子里：颜色是大脑算出来的'], 2,
      '光只有波长，没有颜色。把屏幕放大看，黄色的地方只有红色和绿色的小灯在亮，没有一点黄光，你却看见了黄。品红色更彻底：光谱上根本没有对应它的波长。']
  ], edge: '你看到的蓝，和别人看到的蓝，是同一种感觉吗？至今没有人知道该用什么实验去检验。' },

  { name: '冰为什么浮在水上？', layers: [
    ['几乎所有物质，固体都比自己的液体重，会沉底。冰呢？', ['一样会沉，只是被水流托住了', '反常：冰比水轻大约 9%', '冰和水一样重，靠里面的气泡才浮着'], 1,
      '水结冰时体积会胀大约 9%，所以冰山总有十分之一左右露在水面上。在常见物质里，这样的反常很少见。'],
    ['水结成冰，为什么反而膨胀？', ['冰里冻进了空气', '水分子用氢键搭成六角形的空架子，比乱堆着更占地方', '低温让每个水分子自己变大了'], 1,
      '水分子是弯的，像一个张开约 104.5° 的小角。结冰时每个分子用氢键拉住四个邻居，搭出一个到处是空洞的六角形架子。液态水里分子挤来挤去，反而排得更紧。雪花有六个角，也是这个原因。'],
    ['水在几度的时候最重？', ['0 ℃', '4 ℃', '100 ℃'], 1,
      '4 ℃。湖水变冷时，4 ℃ 的水沉到最底下，更冷的水反而浮在上面，所以湖总是从水面开始结冰。'],
    ['假如冰比水重，世界会怎样？', ['没什么区别，只是看不到冰山了', '湖和海会从底往上冻实，夏天也化不透', '海平面会低一点'], 1,
      '冰浮在上面，像一床被子盖住了下面的水，鱼可以在 4 ℃ 的湖底过冬。如果冰会下沉，每个冬天新结的冰都沉到晒不到太阳的水底，一年年积起来，高纬度的湖海会冻成实心。']
  ], edge: '水有几十种这样的反常性质，生命恰好处处依赖它们。换一种液体，生命还能出现吗？我们只见过地球这一个例子。' },

  { name: '夏天为什么热？', layers: [
    ['夏天为什么比冬天热？', ['夏天地球离太阳更近', '地轴是歪的：夏天阳光更直，白天也更长', '太阳在夏天烧得更旺'], 1,
      '北半球过夏天的时候，地球其实正处在离太阳最远的位置附近（七月初，约 1.52 亿公里；一月初反而最近，约 1.47 亿公里）。决定冷热的是阳光照下来的角度和白天的长短。'],
    ['有什么简单的证据能否定“离太阳近”这个说法？', ['夏天的太阳看起来更大', '北京是夏天的时候，悉尼是冬天', '夏天的影子更长'], 1,
      '如果是距离的缘故，整个地球应该同时过夏天。实际上南北半球的季节正好相反，只有“地轴歪着”能解释。'],
    ['地轴歪了大约 23.4°。它是怎么歪的？', ['被太阳的引力慢慢拉歪的', '很可能是早期被一颗火星大小的天体撞歪的', '地球自转太快，自己甩歪的'], 1,
      '目前的主流假说是：45 亿年前，一颗火星大小的天体斜着撞上了年轻的地球。这一撞让地球歪了，撞飞的碎片后来聚成了月亮。'],
    ['这个倾角会变吗？', ['永远固定不变', '会小幅摆动，大约 4 万年一个来回，冰期的节奏和它有关', '每年都在乱变'], 1,
      '它在大约 22.1° 到 24.5° 之间缓慢摆动，周期约 4.1 万年，是冰期来去的节拍器之一。摆幅这么小要感谢月亮：没有大卫星的火星，倾角会大幅度地乱晃。']
  ], edge: '如果没有月亮稳住地轴，地球的气候还能稳定到让复杂生命出现吗？像月亮这样的大卫星，在宇宙里有多罕见？' },

  { name: '向日葵为什么长成螺旋？', layers: [
    ['向日葵花盘上有两组方向相反的螺旋。它们的条数通常是哪一组？', ['30 和 60', '34 和 55', '每朵都不一样，没有规律'], 1,
      '几乎总是 34 和 55，或者 55 和 89。松果是 8 和 13，菠萝是 8、13 和 21。它们全是斐波那契数列里相邻的数：每一项是前两项之和。'],
    ['植物不会数数。这些数字是哪来的？', ['基因里直接写着“34”和“55”', '每颗种子只是比上一颗多转一个固定的角度', '是蜜蜂采蜜时踩出来的'], 1,
      '种子从花盘中心一颗颗长出来，每颗比上一颗多转 137.5°，然后被后来者往外推。植物只做这一件事，螺旋和那些数字是自己冒出来的。'],
    ['为什么偏偏是 137.5°？', ['它正好是一圈的八分之三', '它对应一个最不像分数的比例，种子永远排不成直线', '这个角度晒到的太阳最多'], 1,
      '如果每次转一圈的简单分数，比如 2/5 圈，每 5 颗种子就回到同一方向，排成 5 条直线，中间全是空隙。要不留空隙，就得用最难被分数逼近的比例，也就是黄金比例 φ ≈ 1.618：360° ÷ φ² ≈ 137.5°。斐波那契数相邻两项之比正是 φ 最好的分数近似。'],
    ['植物是怎么“找到”这个角度的？', ['细胞里有一把专门量角度的尺子', '每个新芽只是长在最空的地方，角度自己就出来了', '靠太阳的方向来校准'], 1,
      '旧芽点会抽走周围的生长素，新芽只能在剩得最多、也就是最空的地方冒出来。反复执行这一条规则，角度就自动收敛到 137.5°。1992 年，两位物理学家让磁性液滴在磁场里互相排斥着落下，得到了一模一样的螺旋，一点生物学都不需要。']
  ], edge: '一条简单的局部规则就能长出向日葵。斑马的条纹、你的指纹、大脑的沟回，还有多少形状是这样自己长出来的？' },

  { name: '月亮为什么总是同一面？', layers: [
    ['我们永远只能看到月亮的同一面。月亮自转吗？', ['不自转', '自转，转一圈的时间恰好等于绕地球一圈', '转得飞快，所以看上去没动'], 1,
      '月亮每绕地球一圈，自己也正好转一圈，大约 27.3 天，所以总是同一面朝着我们。如果它完全不自转，我们反而能轮流看到它的每一面。'],
    ['自转和公转的时间分秒不差。这是巧合吗？', ['是巧合', '不是：地球的引力把月亮的自转刹成了这样', '月亮形成的那一刻就是这样'], 1,
      '地球的引力把月亮拉得微微鼓起。早期月亮转得快，鼓包总想转走，又被地球拽回来，像一只刹车。刹到自转和公转同步为止。这叫潮汐锁定，太阳系的大卫星几乎都被锁住了。'],
    ['月亮也在对地球做同样的事。地球的一天在怎样变化？', ['越来越短', '越来越长，每一百年长大约 2 毫秒', '一直不变'], 1,
      '月亮拉起的潮水在摩擦地球，给自转踩刹车。4 亿年前的珊瑚化石上能数出每天长一圈的纹路：那时一年大约有 400 天，一天只有 22 小时左右。'],
    ['地球越转越慢，丢掉的那份转动去哪了？', ['变成热，消失了', '给了月亮：它每年离我们远大约 3.8 厘米', '传给了太阳'], 1,
      '阿波罗宇航员在月面留下了反射镜，今天仍然可以从地球打激光上去，测出月亮每年远离约 3.8 厘米。很久以后，月亮在天上会小得盖不住太阳，日全食将不再出现。']
  ], edge: '最早的生命，是不是在一涨一落的潮汐池里拼出来的？没有月亮，还会有我们吗？' },

  { name: '太阳为什么能亮这么久？', layers: [
    ['太阳靠什么发光？', ['像一大团煤在燃烧', '核聚变：氢变成氦，一部分质量直接变成了能量', '内部有滚烫的岩浆'], 1,
      '如果太阳是一整团煤，几千年就烧完了。它每秒把大约 6 亿吨氢聚变成氦，其中约 400 万吨质量直接消失，按 E = mc² 变成了光和热。'],
    ['质子都带正电，互相排斥。太阳核心有 1500 万度，够它们硬撞到一起吗？', ['够，1500 万度已经热到头了', '不够。按经典物理，大约要 100 亿度', '不用撞，引力会把它们压在一起'], 1,
      '要靠热运动的速度硬冲过电排斥力，大约需要 100 亿度。太阳核心只有 1500 万度。照经典物理算，太阳太冷了，根本不该发光。'],
    ['那太阳凭什么亮着？', ['质子有极小的概率，直接“穿过”那堵它翻不过去的墙', '太阳里有一种我们还没发现的燃料', '核心其实远比 1500 万度热'], 0,
      '这叫量子隧穿。质子不只是一颗小球，也是一团概率波，有极小的机会直接出现在墙的另一边。机会小到核心里的一个质子平均要等几十亿年才成功一次；但太阳里有大约 10 的 57 次方个质子，所以每秒仍有天文数字的反应。'],
    ['假如隧穿变得容易得多，会怎样？', ['太阳更亮，地球更暖，生命更繁盛', '太阳很快就把自己烧光了', '没什么区别'], 1,

const RANKS = [[0, '岸边的人'], [800, '浮潜者'], [2500, '潜水员'], [5000, '深潜员'], [9000, '深渊探索者'], [15000, '海沟常客'], [30000, '住在海底的人']];
const $ = id => document.getElementById(id);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

let meta = { stars: {}, depth: 0, streak: 0, bestStreak: 0, rushBest: 0, mute: false };
try { const m = JSON.parse(localStorage.getItem('zaiwen-meta') || 'null'); if (m && typeof m === 'object') meta = Object.assign(meta, m, { stars: Object.assign({}, m.stars) }); } catch (e) {}
const save = () => { try { localStorage.setItem('zaiwen-meta', JSON.stringify(meta)); } catch (e) {} };

let view = 'home', dive = null, rush = null;
const doneCount = () => SITES.filter((_, i) => meta.stars[i] > 0).length;
const unlocked = i => i < 3 + doneCount();
const rankOf = d => RANKS.filter(r => r[0] <= d).pop();
const starStr = n => '★'.repeat(n) + '☆'.repeat(3 - n);
const mult = () => Math.min(5, 1 + Math.max(0, meta.streak - 1) * 0.5);

let actx = null;
function sound(kind) {
  if (meta.mute) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const up = Math.min(meta.streak, 8) * 40;
    const notes = { right: [[523 + up, .08], [784 + up, .12]], wrong: [[220, .12], [165, .2]], end: [[392, .12], [523, .12], [659, .12], [784, .12], [1047, .35]], tap: [[440, .05]] }[kind];
    let t = actx.currentTime;
    for (const [f, d] of notes) {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(.08, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d); t += d * .9;
    }
  } catch (e) {}
}

function topBar(extra) {
  return `<div class="top"><span class="brand">再问一层</span><span style="display:flex;gap:8px;align-items:center">${extra || ''}<button class="mini" data-act="mute" type="button">${meta.mute ? '声音：关' : '声音：开'}</button></span></div>`;
}

function renderHome() {
  const r = rankOf(meta.depth), next = RANKS[RANKS.indexOf(r) + 1];
  const pct = next ? (meta.depth - r[0]) / (next[0] - r[0]) * 100 : 100;
  const totalStars = SITES.reduce((t, _, i) => t + (meta.stars[i] || 0), 0);
  const done = doneCount();
  $('app').innerHTML = topBar() + `
    <div class="rank">
      <div class="row"><h1>${r[1]}</h1><span class="num">${Math.round(meta.depth).toLocaleString('en-US')} 米</span></div>
      <div class="bar"><i style="width:${pct.toFixed(0)}%"></i></div>
      <div class="row muted"><span>${next ? `再潜 ${Math.ceil(next[0] - meta.depth).toLocaleString('en-US')} 米成为「${next[1]}」` : '已经到了最深的称号'}</span><span>${starStr(0).replace(/☆/g, '') || ''}<span class="num">${totalStars}</span> / 30 星　连对纪录 <span class="num">${meta.bestStreak}</span></span></div>
    </div>
    <p class="muted">每个答案下面都还压着一个问题。先猜，再揭晓；连着猜对，下潜得越来越快。潜到底，是没人知道答案的地方。</p>
    <div class="sites">${SITES.map((s, i) => {
      const st = meta.stars[i] || 0, open = unlocked(i);
      return `<button class="site" data-site="${i}" type="button" ${open ? '' : 'disabled'}><b>${open ? s.name : '还没发现的潜点'}</b><span class="stars">${open ? starStr(st) : ''}</span><small>${open ? (st ? (st === 3 ? '满氧到底' : '到过底，再潜一次争取三星') : `${s.layers.length} 层，还没到过底`) : '再潜到一个底就会出现'}</small></button>`;
    }).join('')}</div>
    <button class="rush" data-act="rush" type="button" ${done >= 2 ? '' : 'disabled'}>连击挑战<small>${done >= 2 ? `从你到过底的潜点里随机出题，错一题就结束。纪录：连对 ${meta.rushBest}` : '先潜到两个底，这里才会打开'}</small></button>
    <h2>没人知道答案的问题　<span class="num">${done}</span> / ${SITES.length}</h2>
    <div class="cards">${SITES.map((s, i) => meta.stars[i] > 0 ? `<div class="mystery">${s.edge}</div>` : `<div class="mystery locked">${unlocked(i) ? '潜到「' + s.name + '」的底才能看到' : '？？？'}</div>`).join('')}</div>`;
}

function startDive(i) { dive = { t: i, i: 0, oxy: 3, pick: null, perm: shuffle([0, 1, 2]), gained: 0, stage: 'q' }; view = 'dive'; render(); }

function renderDive() {
  const S = SITES[dive.t], n = S.layers.length;
  const hud = `<div class="hud"><button class="mini" data-act="home" type="button">回水面</button>
    <span class="oxy">氧气 ${[0, 1, 2].map(k => `<i class="${k < dive.oxy ? '' : 'gone'}"></i>`).join('')}</span>
    <span>连对 <span class="num">${meta.streak}</span>　下潜速度 <span class="num">×${mult().toFixed(1)}</span></span></div>
    <div class="gauge">${S.layers.map((_, k) => `<i class="${k <= dive.i && dive.stage !== 'out' ? 'd' + Math.min(4, k + 1) : 'todo'}"></i>`).join('')}</div>`;
  let body;
  if (dive.stage === 'end') {
    const first = dive.firstTime;
    body = `<section class="layer end"><span class="tag">已知的边缘 · ${S.name}</span>
      <p class="big">${S.edge}</p>
      <p class="bigstars">${starStr(dive.oxy)}</p>
      <p>${dive.oxy === 3 ? '满氧到底，一题没错。' : `到底了，路上猜错 ${3 - dive.oxy} 次。再潜一次可以争取三星。`}这一趟下潜 <span class="num">${Math.round(dive.gained)}</span> 米。${first && doneCount() < SITES.length ? '水面上多了一个新的潜点。' : ''}${first && doneCount() === 2 ? '连击挑战也打开了。' : ''}</p>
      <div class="rowbtn">${dive.oxy < 3 ? '<button class="ghost" data-act="again" type="button">再潜一次</button>' : ''}<button class="go" data-act="home" type="button">回水面</button></div></section>`;
  } else if (dive.stage === 'out') {
    body = `<section class="layer d1"><span class="tag">氧气用完了</span><h1>这次只能先上浮。</h1><p>刚才看到的答案都还算数，再下去一次会顺利得多。</p>
      <div class="rowbtn"><button class="ghost" data-act="home" type="button">回水面</button><button class="go" data-act="again" type="button">再潜一次</button></div></section>`;
  } else {
    const L = S.layers[dive.i], d = Math.min(4, dive.i + 1), picked = dive.pick !== null;
    const good = dive.pick === L[2];
    body = `<section class="layer d${d}"><span class="tag">第 ${dive.i + 1} 层 / 共 ${n} 层</span><h1>${L[0]}</h1>
      <div class="opts">${dive.perm.map(k => `<button class="opt${picked && k === L[2] ? ' right' : ''}${picked && k === dive.pick ? ' mine' + (good ? '' : ' wrong') : ''}" data-k="${k}" type="button" ${picked ? 'disabled' : ''}>${L[1][k]}</button>`).join('')}</div>
      ${picked ? `<p class="verdict${good ? '' : ' no'}">${good ? `猜对了，下潜 ${Math.round(dive.lastGain)} 米。` : '猜错了，少了一格氧气。'}</p><p>${L[3]}</p>
        <button class="go" data-act="next" type="button">${dive.oxy <= 0 ? '上浮' : dive.i + 1 < n ? '再问一层' : '潜到底'}</button>` : '<p class="tag">先猜一个</p>'}</section>`;
  }
  $('app').innerHTML = topBar() + hud + body;
}

function answerDive(k) {
  const L = SITES[dive.t].layers[dive.i];
  dive.pick = k;
  if (k === L[2]) {
    meta.streak++; meta.bestStreak = Math.max(meta.bestStreak, meta.streak);
    dive.lastGain = 100 * mult(); dive.gained += dive.lastGain; meta.depth += dive.lastGain;
    sound('right');
  } else { meta.streak = 0; dive.oxy--; sound('wrong'); }
  save(); render();
}
function nextDive() {
  const S = SITES[dive.t];
  if (dive.oxy <= 0) dive.stage = 'out';
  else if (dive.i + 1 < S.layers.length) { dive.i++; dive.pick = null; dive.perm = shuffle([0, 1, 2]); }
  else {
    dive.stage = 'end'; dive.firstTime = !meta.stars[dive.t];
    meta.stars[dive.t] = Math.max(meta.stars[dive.t] || 0, dive.oxy);
    save(); sound('end');
  }
  render(); window.scrollTo({ top: 0 });
}

function rushPool() { return SITES.flatMap((s, t) => meta.stars[t] > 0 ? s.layers.map((_, i) => [t, i]) : []); }
function startRush() { rush = { run: 0, pool: shuffle(rushPool()), cur: null, pick: null, perm: [], over: false }; nextRush(); view = 'rush'; render(); }
function nextRush() {
  if (!rush.pool.length) rush.pool = shuffle(rushPool());
  rush.cur = rush.pool.pop(); rush.pick = null; rush.perm = shuffle([0, 1, 2]);
}
function renderRush() {
  const [t, i] = rush.cur, L = SITES[t].layers[i], picked = rush.pick !== null, good = rush.pick === L[2];
  const d = Math.min(4, 1 + Math.floor(rush.run / 3));
  $('app').innerHTML = topBar() + `<div class="hud"><button class="mini" data-act="home" type="button">回水面</button><span>连击挑战</span><span>连对 <span class="num">${rush.run}</span>　纪录 <span class="num">${meta.rushBest}</span></span></div>
    <section class="layer d${d}"><span class="tag">${SITES[t].name}</span><h1>${L[0]}</h1>
    <div class="opts">${rush.perm.map(k => `<button class="opt${picked && k === L[2] ? ' right' : ''}${picked && k === rush.pick ? ' mine' + (good ? '' : ' wrong') : ''}" data-k="${k}" type="button" ${picked ? 'disabled' : ''}>${L[1][k]}</button>`).join('')}</div>
    ${rush.over ? `<p class="verdict no">断了。这次连对 ${rush.run} 题${rush.newBest ? '，新纪录' : ''}。</p><p>${L[3]}</p>
      <div class="rowbtn"><button class="ghost" data-act="home" type="button">回水面</button><button class="go" data-act="rush" type="button">再来一次</button></div>` : picked ? '<p class="verdict">对。</p>' : '<p class="tag">错一题就结束</p>'}</section>`;
}
function answerRush(k) {
  if (rush.pick !== null) return;
  const [t, i] = rush.cur, L = SITES[t].layers[i];
  rush.pick = k;
  if (k === L[2]) {
    rush.run++; meta.streak++; meta.bestStreak = Math.max(meta.bestStreak, meta.streak); meta.depth += 50;
    rush.newBest = rush.run > meta.rushBest; if (rush.newBest) meta.rushBest = rush.run;
    save(); sound('right'); render();
    const mine = rush;
    setTimeout(() => { if (view === 'rush' && rush === mine && !rush.over) { nextRush(); render(); } }, 550);
  } else { rush.over = true; rush.newBest = rush.run > 0 && rush.run >= meta.rushBest; meta.streak = 0; save(); sound('wrong'); render(); }
}

function render() { view === 'home' ? renderHome() : view === 'dive' ? renderDive() : renderRush(); }

$('app').onclick = e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  const act = b.dataset.act;
  if (b.dataset.site !== undefined) { sound('tap'); startDive(+b.dataset.site); window.scrollTo({ top: 0 }); }
  else if (b.dataset.k !== undefined) { view === 'dive' ? (dive.pick === null && answerDive(+b.dataset.k)) : answerRush(+b.dataset.k); }
  else if (act === 'next') nextDive();
  else if (act === 'again') startDive(dive.t);
  else if (act === 'home') { view = 'home'; render(); window.scrollTo({ top: 0 }); }
  else if (act === 'rush') { sound('tap'); startRush(); window.scrollTo({ top: 0 }); }
  else if (act === 'mute') { meta.mute = !meta.mute; save(); render(); }
};

function start(d) {
  if (d && d.view === 'dive' && d.dive && SITES[d.dive.t]) { dive = d.dive; view = 'dive'; }
  render();
}
window.claude?.hot?.snapshot?.(() => ({ view: view === 'dive' ? 'dive' : 'home', dive }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
window.__game = { SITES, get meta() { return meta; }, get dive() { return dive; }, get rush() { return rush; } };
</script>
</body>
